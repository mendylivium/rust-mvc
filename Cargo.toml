[package]
name = "rust-mvc"
version = "0.1.0"
edition = "2024"
default-run = "forge"

[lib]
path = "bootstrap/lib.rs"

[[bin]]
name = "forge"
path = "main.rs"

[[bin]]
name = "rustmvc-desktop"
path = "desktop/main.rs"
required-features = ["desktop"]

[features]
default = []
embedded-assets = ["dep:rust-embed", "dep:mime_guess"]
desktop = ["dep:tauri", "dep:tauri-build", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
rust-embed = { version = "8", optional = true, features = ["debug-embed"] }
mime_guess = { version = "2", optional = true }
tauri = { version = "2", optional = true, features = [] }

anyhow = "1"
url = "2"
syn = { version = "2", default-features = false, features = ["parsing", "proc-macro"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
time = "0.3"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "any", "mysql", "postgres", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
validator = { version = "0.20", features = ["derive"] }

tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
