services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${DOCKER_BIND_IP:-127.0.0.1}:${DOCKER_PORT:-8080}:3000'
    environment:
      APP_NAME: ${APP_NAME:-RustMVC}
      APP_HOST: 0.0.0.0
      APP_PORT: '3000'
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-}
      DB_DATABASE: ${DB_DATABASE:-storage/database.sqlite}
      DB_USERNAME: ${DB_USERNAME:-rustmvc}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_SSLMODE: ${DB_SSLMODE:-}
      DATABASE_URL: ${DATABASE_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RUST_LOG: ${RUST_LOG:-rust_mvc=info,tower_http=info}
    volumes:
      - app-storage:/app/storage
    # A failed migration prevents the server from starting. exec forwards SIGTERM.
    command: ['sh', '-c', 'forge migrate && exec forge serve']
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        ['CMD', 'curl', '--fail', '--silent', '--max-time', '3', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  app-storage:
