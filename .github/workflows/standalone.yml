name: Standalone builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev pkg-config
      - run: npm ci
      - run: npm run build:server -- --target ${{ matrix.target }} --arch x64
      - run: cargo test --locked --features embedded-assets --test embedded --test desktop
      - run: npm run build:desktop -- --target ${{ matrix.target }} --arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: rustmvc-${{ matrix.target }}-x64
          path: releases/
          include-hidden-files: true
